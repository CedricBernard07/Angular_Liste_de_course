<div class="articles-card">
  <!-- Navigation entre les 2 "pages" -->
  <div class="articles-nav">
    <button (click)="goToCurrent()" [disabled]="!showHistory">
      Liste actuelle
    </button>
    <button (click)="goToHistory()" [disabled]="showHistory">
      Historique
    </button>
  </div>

  <!-- PAGE PRINCIPALE : liste actuelle -->
  <ng-container *ngIf="!showHistory; else historyView">
    <h2>Mes articles</h2>

    <div class="articles-input-row">
      <input
        type="text"
        [(ngModel)]="newArticle"
        placeholder="Nouvel article"
        (keyup.enter)="addArticle()" 
        (input)="errorMessage = ''"
      />

      <!-- Choix de catégorie -->
      <div class="articles-category">
        <label>
          <input
            type="radio"
            name="category"
            value="alimentaire"
            [(ngModel)]="category"
          />
          Alimentaire
        </label>

        <label>
          <input
            type="radio"
            name="category"
            value="nonAlimentaire"
            [(ngModel)]="category"
          />
          Non alimentaire
        </label>
      </div>

      <!-- Si on appuie sur la touche "entrée", cela fait aussi l'ajout -->
      <button (click)="addArticle()">Ajouter</button>
    </div>

    <!-- Message d'erreur en rouge si doublon -->
    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <!-- Deux sous-listes côte à côte -->
    <div class="articles-columns">
      <div class="articles-column">
        <h3>Alimentaire</h3>
        <ul class="articles-list">
          <li *ngFor="let article of articlesAlimentaires; let i = index">
            <span>{{ article }}</span>
            <button (click)="removeArticle('alimentaire', i)">X</button>
          </li>
        </ul>
      </div>

      <div class="articles-column">
        <h3>Non alimentaire</h3>
        <ul class="articles-list">
          <li *ngFor="let article of articlesNonAlimentaires; let i = index">
            <span>{{ article }}</span>
            <button (click)="removeArticle('nonAlimentaire', i)">X</button>
          </li>
        </ul>
      </div>
    </div>

    <!-- Actions : archiver + tout vider -->
    <div
      class="articles-actions"
      *ngIf="articlesAlimentaires.length > 0 || articlesNonAlimentaires.length > 0"
    >
      <button (click)="archiveCurrentList()">Archiver et vider</button>
      <br> <br> <!-- retour a la ligne entre les 2 boutons -->
      <button (click)="clearAll()">Tout vider (oublier)</button>
    </div>
  </ng-container>

  <!-- PAGE HISTORIQUE -->
  <ng-template #historyView>
    <div class="history-view">
      <h2>Historique des listes</h2>

      <div class="articles-actions" *ngIf="archives.length > 0">
        <button (click)="clearArchives()">Vider l'historique</button>
      </div>

      <p *ngIf="archives.length === 0">
        Aucune liste archivée pour l'instant.
      </p>

      <div *ngFor="let archive of archives" class="archive-entry">
        <h3>
          Liste du {{ archive.createdAt | date:'short' }}
        </h3>

        <div class="articles-columns">
          <div class="articles-column">
            <h4>Alimentaire</h4>
            <ul class="articles-list">
              <li *ngFor="let a of archive.articlesAlimentaires">
                {{ a }}
              </li>
            </ul>
          </div>

          <div class="articles-column">
            <h4>Non alimentaire</h4>
            <ul class="articles-list">
              <li *ngFor="let a of archive.articlesNonAlimentaires">
                {{ a }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</div>
